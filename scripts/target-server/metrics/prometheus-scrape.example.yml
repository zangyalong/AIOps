# 复制到中央 Prometheus 的 scrape_configs 下，并把 10.0.0.12 改为目标服务器地址。
# 只保留 deploy.conf 中已启用的组件。

- job_name: web01-node
  static_configs:
    - targets: ["10.0.0.12:9100"]
      labels:
        server: web01
        environment: prod
        service: node-exporter
        runtime_type: docker
        runtime_name: aiops-node-exporter

- job_name: web01-cadvisor
  static_configs:
    - targets: ["10.0.0.12:8080"]
      labels:
        server: web01
        environment: prod
        runtime_type: docker
  # 优先读取业务容器显式设置的 aiops.service 标签，其次使用 Docker Compose service，
  # 最后退化为容器名。这样 cAdvisor 的每条容器指标能映射到具体服务，而不是统一叫 cadvisor。
  metric_relabel_configs:
    - source_labels: [container_label_aiops_service]
      regex: "(.+)"
      target_label: service
    - source_labels: [service, container_label_com_docker_compose_service]
      regex: ";(.+)"
      replacement: "$1"
      target_label: service
    - source_labels: [service, name]
      regex: ";/?(.+)"
      replacement: "$1"
      target_label: service
    - source_labels: [name]
      regex: "/?(.+)"
      replacement: "$1"
      target_label: runtime_name

- job_name: web01-mysql
  static_configs:
    - targets: ["10.0.0.12:9104"]
      labels:
        server: web01
        environment: prod
        service: mysqld
        runtime_type: docker
        runtime_name: aiops-mysql-exporter

- job_name: web01-postgres
  static_configs:
    - targets: ["10.0.0.12:9187"]
      labels:
        server: web01
        environment: prod
        service: example-api-postgres
        runtime_type: docker
        runtime_name: aiops-postgres-exporter

- job_name: web01-redis
  static_configs:
    - targets: ["10.0.0.12:9121"]
      labels:
        server: web01
        environment: prod
        service: example-api-redis
        runtime_type: docker
        runtime_name: aiops-redis-exporter
