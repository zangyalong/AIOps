# 方向一「真实数据接入」的本地数据源，按任务逐步加进来（最小起步策略）。
# - 任务1（Prometheus 指标）：prometheus + node-exporter
# - 任务2（Loki 日志）：loki + promtail（采集容器日志）+ fake-app（造带级别的假应用日志）
# - 任务3（Alertmanager 告警）：到时候再加 alertmanager + 告警规则
#
# 用法：
#   docker compose up -d          # 后台起
#   docker compose ps             # 看状态
#   docker compose logs -f        # 看日志
#   docker compose down           # 停并删容器（数据在容器里，删了重来即可，纯本地开发无所谓）

services:
  # 时序指标数据库 + PromQL 查询引擎。后端的 query_metrics 工具就是打它的 HTTP API。
  prometheus:
    image: prom/prometheus:latest   # 先用 latest 保证能拉到；稳定后可以 pin 成具体版本
    container_name: aioms-prometheus
    ports:
      - "9090:9090"                 # 对应 backend config 里的 prometheus_base_url
    volumes:
      # 抓取配置：告诉 Prometheus 去哪些 target 拉指标。只读挂载。
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # 主机指标导出器：把 CPU/内存/磁盘/网络等暴露成 Prometheus 能抓的 /metrics。
  # 它是 query_metrics 工具里 cpu/memory/disk 那几个 PromQL 模板的数据来源。
  #
  # ⚠️ macOS 说明：Docker Desktop 跑在一个 Linux 虚拟机里，所以这里的 node_exporter
  # 报的是「那台 Linux VM」的指标，不是你 macOS 宿主机的真实指标。对学这个工具怎么写、
  # 怎么解析 PromQL 完全够用（数据是真的、会实时变化），只是别把数字当成你 Mac 的真实负载。
  # 在真正的 Linux 服务器上跑，报的就是宿主机真实指标。
  node-exporter:
    image: prom/node-exporter:latest
    container_name: aioms-node-exporter
    ports:
      - "9100:9100"
    # 下面这组是 node_exporter 采集宿主机（Linux 上）真实指标的标准姿势：
    # 把宿主机的 /proc、/sys、/ 只读挂进容器，并用 --path.rootfs 指过去。
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  # ---- 任务2：Loki 日志 ----

  # 日志聚合库 + LogQL 查询引擎。后端的 search_logs 工具打它的 HTTP API。
  # 用官方镜像自带的单体默认配置（filesystem 存储、无认证），开箱即用。
  loki:
    image: grafana/loki:latest
    container_name: aioms-loki
    ports:
      - "3100:3100"                 # 对应 backend config 里的 loki_base_url
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # 日志采集器：通过 Docker socket 发现本机所有容器、读它们的日志，打上 container 标签
  # 推送给 Loki。这样 search_logs 就能按 {container="xxx"} 查某个容器的日志。
  promtail:
    image: grafana/promtail:latest
    container_name: aioms-promtail
    volumes:
      - ./docker/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # 发现容器 + 读日志都走这个 socket
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # 造点带级别（INFO/WARN/ERROR）的假应用日志，让 search_logs 的关键词/级别过滤有真实内容
  # 可查——它之于「日志」，就像 node-exporter 之于「指标」，是个纯为验证工具而起的数据源。
  # 生产环境当然不需要它。容器名 aioms-fake-app，promtail 会把它的日志打上 container=aioms-fake-app。
  fake-app:
    image: busybox:latest
    container_name: aioms-fake-app
    # Loki 按摄入时刻给每行日志打时间戳，所以行里不用自己写时间。
    command:
      - sh
      - -c
      - |
        while true; do
          echo "INFO  handled request path=/api/orders latency=210ms"
          sleep 3
          echo "WARN  slow query 812ms on orders table"
          sleep 3
          echo "ERROR connect timeout to db-01:5432 after 3s"
          sleep 4
        done
    restart: unless-stopped
