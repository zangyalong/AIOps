# AIOps 本地依赖：Prometheus、Loki、Alertmanager、Grafana 和 Redis。
# 指标抓取目标来自 docker/prometheus-targets/ 下被 Git 忽略的本地配置；日志由纳管服务器上的
# Alloy 或其他外部采集端写入 Loki。这里不再捆绑仅供演示的指标、日志发生器。
#
# 用法：
#   docker compose up -d          # 后台起
#   docker compose ps             # 看状态
#   docker compose logs -f        # 看日志
#   docker compose down           # 停并删容器（数据在容器里，删了重来即可，纯本地开发无所谓）
#
# 所有宿主机端口只绑定 127.0.0.1。这套配置包含无认证服务和匿名 Grafana Editor，
# 只用于本地开发或受控测试，不能直接改成 0.0.0.0 暴露到局域网/公网。

services:
  # 时序指标数据库 + PromQL 查询引擎。后端的 query_metrics 工具就是打它的 HTTP API。
  prometheus:
    image: prom/prometheus:latest   # 先用 latest 保证能拉到；稳定后可以 pin 成具体版本
    container_name: aiops-prometheus
    ports:
      - "127.0.0.1:9090:9090"       # 对应 backend config 里的 prometheus_base_url
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      # 抓取配置：告诉 Prometheus 去哪些 target 拉指标。只读挂载。
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # UI 管理规则单独挂载目录，原子替换规则文件后容器仍能看到新 inode。
      - ./docker/prometheus-rules:/etc/prometheus/rules:ro
      # 真实服务器抓取目标保存在 Git 忽略的本地目录，避免把资产地址提交到仓库。
      - ./docker/prometheus-targets:/etc/prometheus/targets:ro
    restart: unless-stopped

  # 日志聚合库 + LogQL 查询引擎。后端的 search_logs 工具打它的 HTTP API。
  # 用官方镜像自带的单体默认配置（filesystem 存储、无认证），开箱即用。
  loki:
    image: grafana/loki:latest
    container_name: aiops-loki
    ports:
      - "127.0.0.1:3100:3100"       # 对应 backend config 里的 loki_base_url
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # 告警分发器：接收 Prometheus 推来的 firing 告警。后端的 query_alerts 工具查它的
  # /api/v2/alerts 拿当前正在触发的告警；webhook receiver 同时把告警推给后端事件入口。
  alertmanager:
    image: prom/alertmanager:latest
    container_name: aiops-alertmanager
    ports:
      - "127.0.0.1:9093:9093"       # 对应 backend config 里的 alertmanager_base_url
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  # 指标/日志的图形前端。它自己不存数据，接到 Prometheus + Loki 上把数据画成图表。
  # 服务目录提供轻量趋势图，Grafana 提供可缩放的服务器 Dashboard 和 Agent Explore 链接。
  grafana:
    image: grafana/grafana:latest
    container_name: aiops-grafana
    ports:
      - "127.0.0.1:3000:3000"       # 对应 backend config 里的 grafana_base_url
    environment:
      # 本地开发图省事：开匿名访问，点链接不用登录就能看图。
      # 角色给 Editor 而不是 Viewer——Grafana 的 Explore 页默认只对 Editor/Admin 开放，
      # Viewer 点 Explore 链接会被重定向回首页（看不到图）。生产绝不能这样，那要接真实登录/权限。
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_USERS_DEFAULT_LANGUAGE=zh-Hans
    volumes:
      # provisioning：容器一起来就自动把 Prometheus/Loki 配成数据源（固定 uid），
      # 省得人工去 UI 加，也让 agent 拼链接能用确定的数据源 uid。
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # arq（异步任务队列）的 broker。告警自动诊断这类后台作业存在这里，worker 从这里取来跑。
  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    ports:
      - "127.0.0.1:6379:6379"       # 对应 backend config 里的 redis_url
    restart: unless-stopped
