# Grafana 数据源 provisioning（任务4）。Grafana 容器启动时自动读取，把 Prometheus / Loki
# 配成数据源，不用人工去 UI 里点。
#
# 关键：uid 写成固定值（prometheus / loki）。Grafana 的 Explore 链接是靠数据源 uid 定位的，
# 固定下来后，agent 生成链接时就能用确定的 uid 拼，不用去查 Grafana 当前给数据源分了什么 uid。
# url 用 compose 网络里的服务名（prometheus:9090 / loki:3100），access: proxy 表示由 Grafana
# 后端代理转发到数据源。

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
