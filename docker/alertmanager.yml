# Alertmanager 配置。被 docker-compose 挂到 alertmanager 容器的 /etc/alertmanager/alertmanager.yml。
#
# 方向二：从"只读告警"升级成"把告警推给后端"。receiver 改成 webhook，指向后端的 /alerts/webhook，
# 后端收到后落 alert_events 表——这是事件驱动的入口。
#
# 地址用 host.docker.internal：Alertmanager 跑在 Docker 里，后端跑在宿主机 :8010，容器要用这个
# 特殊域名才能访问到宿主机（Docker Desktop 上可用）。send_resolved: true 表示告警恢复时也推一条。

route:
  receiver: "aiops-backend"
  # 同类告警攒一攒再处理的窗口，本地开发配置给小一点，让告警尽快推过来。
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: "aiops-backend"
    webhook_configs:
      - url: "http://host.docker.internal:8010/alerts/webhook"
        send_resolved: true
