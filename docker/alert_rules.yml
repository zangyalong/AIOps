# Prometheus 告警规则（任务3）。被 docker-compose 挂到 prometheus 容器的
# /etc/prometheus/alert_rules.yml。改了这里：docker compose restart prometheus。
#
# 这里几条是「demo 告警」——为了让 query_alerts 工具有真实处于 firing 状态的告警可查，
# 故意把阈值设得很容易命中 / 用恒真表达式。生产环境的规则当然是按真实故障阈值写。

groups:
  - name: aioms-demo-alerts
    rules:
      # 管道自检：vector(1) 恒为真，所以这条一直 firing。看到它就说明
      # 「Prometheus 评估规则 → 推送 Alertmanager」这条链路是通的（业界惯例叫 Watchdog）。
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: info
        annotations:
          summary: "告警链路自检（始终触发，用于确认 Alertmanager 通路正常）"

      # 内存使用率偏高：用真实的 node_exporter 指标，但阈值故意设成 1%（本地几乎必然超过），
      # 用来演示「由真实指标触发的告警」，instance 标签来自被采集的实例。
      - alert: NodeMemoryUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "节点内存使用率偏高（demo 阈值 1%）"
          description: "{{ $labels.instance }} 内存使用率约 {{ $value | printf \"%.1f\" }}%"

      # 一条 critical 的合成告警，带上 instance 标签，方便演示 query_alerts 按 severity /
      # instance 过滤。expr 恒真，所以稳定 firing。
      - alert: DiskWillFillSoon
        expr: vector(1)
        labels:
          severity: critical
          instance: "db-01:9100"
        annotations:
          summary: "磁盘预计 5 天内写满（synthetic demo 告警，恒触发）"
