# Prometheus 抓取配置。被 docker-compose 挂载到容器的 /etc/prometheus/prometheus.yml。
# 改了这个文件后：docker compose restart prometheus（或在 :9090 页面 reload）。

global:
  scrape_interval: 15s      # 每 15s 抓一次所有 target
  evaluation_interval: 15s  # 每 15s 评估一次告警规则

# 告警规则文件（任务3）。Prometheus 按 evaluation_interval 评估这些规则，命中就把告警置为
# firing 并推给下面 alerting 里配的 Alertmanager。
rule_files:
  - /etc/prometheus/alert_rules.yml

# 把 firing 告警推给谁（任务3）。同一个 compose 网络里按服务名 alertmanager 访问。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus 抓自己，用来验证它活着（会产生 up{job="prometheus"} 指标）
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 抓 node_exporter 的主机指标。target 用 compose 的 service 名 node-exporter，
  # 同一个 docker 网络里能直接按服务名互访。抓到的指标 instance 标签就是 "node-exporter:9100"。
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
