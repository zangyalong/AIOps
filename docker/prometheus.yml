# Prometheus 抓取配置。被 docker-compose 挂载到容器的 /etc/prometheus/prometheus.yml。
# 改了这个文件后：docker compose restart prometheus（或在 :9090 页面 reload）。

global:
  scrape_interval: 15s      # 每 15s 抓一次所有 target
  evaluation_interval: 15s  # 每 15s 评估一次告警规则

# 告警规则由 AIOMS 前端管理并存入数据库，后端自动生成下面这个运行时文件；不要手工编辑。
# Prometheus 按 evaluation_interval 评估这些规则，命中就把告警置为 firing 并推给 Alertmanager。
rule_files:
  - /etc/prometheus/rules/managed_alert_rules.yml

# 把 firing 告警推给谁（任务3）。同一个 compose 网络里按服务名 alertmanager 访问。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus 抓自己，用来验证它活着（会产生 up{job="prometheus"} 指标）
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 抓 node_exporter 的主机指标。target 用 compose 的 service 名 node-exporter，
  # 同一个 docker 网络里能直接按服务名互访。抓到的指标 instance 标签就是 "node-exporter:9100"。
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: web01-mysql
    static_configs:
      - targets: ["139.196.175.226:9104"]
        labels:
          server: web-01
          environment: prod
          service: mysqld
          runtime_type: docker
          runtime_name: aioms-mysql-exporter

  - job_name: web01-node
    static_configs:
      - targets: ["139.196.175.226:9100"]
        labels:
          server: web-01
          environment: prod
          service: node-exporter
          runtime_type: docker
          runtime_name: aioms-node-exporter

  - job_name: web01-cadvisor
    static_configs:
      - targets: ["139.196.175.226:8080"]
        labels:
          server: web-01
          environment: prod
          runtime_type: docker
    metric_relabel_configs:
      - source_labels: [container_label_aioms_service]
        regex: "(.+)"
        target_label: service
      - source_labels: [service, container_label_com_docker_compose_service]
        regex: ";(.+)"
        replacement: "$1"
        target_label: service
      - source_labels: [service, name]
        regex: ";/?(.+)"
        replacement: "$1"
        target_label: service
      - source_labels: [name]
        regex: "/?(.+)"
        replacement: "$1"
        target_label: runtime_name

  - job_name: web01-postgres
    static_configs:
      - targets: ["139.196.175.226:9187"]
        labels:
          server: web-01
          environment: prod
          service: sub2api-postgres
          runtime_type: docker
          runtime_name: aioms-postgres-exporter

  - job_name: web01-redis
    static_configs:
      - targets: ["139.196.175.226:9121"]
        labels:
          server: web-01
          environment: prod
          service: sub2api-redis
          runtime_type: docker
          runtime_name: aioms-redis-exporter
