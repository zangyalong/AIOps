# Prometheus 抓取配置。被 docker-compose 挂载到容器的 /etc/prometheus/prometheus.yml。
# 改了这个文件后：docker compose restart prometheus（或在 :9090 页面 reload）。

global:
  scrape_interval: 15s      # 每 15s 抓一次所有 target
  evaluation_interval: 15s  # 每 15s 评估一次告警规则

# 告警规则由 AIOps 前端管理并存入数据库，后端自动生成下面这个运行时文件；不要手工编辑。
# Prometheus 按 evaluation_interval 评估这些规则，命中就把告警置为 firing 并推给 Alertmanager。
rule_files:
  - /etc/prometheus/rules/managed_alert_rules.yml

# 把 firing 告警推给谁（任务3）。同一个 compose 网络里按服务名 alertmanager 访问。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus 抓自己，用来验证它活着（会产生 up{job="prometheus"} 指标）
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 真实服务器地址不写进受 Git 跟踪的主配置。把
  # docker/prometheus-targets/managed-targets.yml.example 复制为同目录下的
  # managed-targets.yml，再只在本机填写真实 target；该文件已被 .gitignore 排除。
  - job_name: managed-targets
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 30s
    metric_relabel_configs:
      - source_labels: [container_label_aiops_service]
        regex: "(.+)"
        target_label: service
      - source_labels: [service, container_label_com_docker_compose_service]
        regex: ";(.+)"
        replacement: "$1"
        target_label: service
      - source_labels: [service, name]
        regex: ";/?(.+)"
        replacement: "$1"
        target_label: service
      - source_labels: [name]
        regex: "/?(.+)"
        replacement: "$1"
        target_label: runtime_name
